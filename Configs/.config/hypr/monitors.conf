# Set your monitor configuration here
# See https://wiki.hyprland.org/Configuring/Monitors/
# For a sample file, please refer to https://github.com/prasanthrangan/hyprdots/blob/main/Configs/.config/hypr/monitors.t2

monitor = DP-2, 2560x1440@144, 0x0, 1, vrr, 1, bitdepth, 10
monitor = DP-1, 5120x1440@240, -1280x1440, 1, vrr, 1, bitdepth, 10
monitor = HDMI-A-1,disable

experimental {
    xx_color_management_v4 = true
}
render {
    cm_fs_passthrough = 1
    cm_auto_hdr = 1
}

